appId: com.nmsn.browser-dock
productName: Browser Dock
directories:
  buildResources: build
  output: dist
files:
  - out/**/*
  - package.json
mac:
  target:
    - target: dmg
      arch:
        - arm64
        - x64
    - target: zip
      arch:
        - arm64
        - x64
  identity: null
  category: public.app-category.productivity
  icon: build/icon.icns
dmg:
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications
linux:
  target:
    - target: AppImage
      arch:
        - x64
  category: Utility
  icon: build/icon.png
