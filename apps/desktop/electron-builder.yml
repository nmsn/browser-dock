appId: com.nmsn.browser-dock
productName: Browser Dock
directories:
  buildResources: build
  output: dist
files:
  - out/**/*
  - package.json
extraResources:
  - build/tray-icon.png
electronDownload:
  mirror: https://npmmirror.com/mirrors/electron/
mac:
  target:
    - target: dmg
      arch:
        - arm64
        - x64
    - target: zip
      arch:
        - arm64
        - x64
  identity: null
  category: public.app-category.productivity
  icon: build/icon.icns
  # 防 macOS App Nap 休眠主进程导致 cron 调度延迟（文档 10.3）
  extendInfo:
    NSAppSleepDisabled: true
dmg:
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications
win:
  # 无证书不签名；未提供 icon 时使用默认图标（与 mac 现状一致）
  target:
    - target: nsis
      arch:
        - x64
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  shortcutName: Browser Dock
